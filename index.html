        #main-content {

        }
        
        h2 { 
            border-bottom: 1px dashed white; 
            padding-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 50px; 
        }

        .game-box {
            border: 2px solid white; 
            background-color: black; 
            padding: 20px 10px; 
            text-align: center;
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-transform: uppercase; 
            font-weight: bold;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        .game-box:hover { 
            background-color: white; 
            color: black; 
        }
        
        .game-img {
            max-width: 100%; 
            height: 150px; 
            object-fit: cover; 
            margin-bottom: 15px;
            border: 1px solid white; 
            transition: all 0.3s ease;
        }

        /* --- NEW STYLES FOR THE IN-PAGE GAME PLAYER --- */
        #game-player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            /* Start hidden below the screen */
            transform: translateY(100%);
            /* Smooth slide up animation */
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #game-player-overlay.active {
            /* Slide up into view */
            transform: translateY(0);
        }

        #close-game-btn {
            background-color: white;
            color: black;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-bottom: 2px solid black;
            transition: background-color 0.3s ease;
        }

        #close-game-btn:hover {
            background-color: red;
            color: white;
        }

        #game-iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: #111;
        }

    <!-- LOGIC SCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            
            // Intro Screen Fade Logic
            setTimeout(() => {
                const introScreen = document.getElementById('intro-screen');
                const mainContent = document.getElementById('main-content');
                introScreen.style.opacity = '0';
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    document.body.style.overflow = 'auto'; 
                    mainContent.style.opacity = '1'; 
                }, 1000);
            }, 3000); 

            // Read the JSON Data from the block above
            const rawJSON = document.getElementById('gameDataJSON').textContent;
            const gameData = JSON.parse(rawJSON);

            // Game Player Elements
            const gameOverlay = document.getElementById('game-player-overlay');
            const gameIframe = document.getElementById('game-iframe');
            const closeBtn = document.getElementById('close-game-btn');

            // Function to launch the game inside the page
            function launchGame(url) {
                gameIframe.src = url; // Load the link into the iframe
                gameOverlay.classList.add('active'); // Trigger the slide-up animation
                document.body.style.overflow = 'hidden'; // Stop background scrolling
            }

            // Close button logic
            closeBtn.addEventListener('click', () => {
                gameOverlay.classList.remove('active'); // Slide it back down
                document.body.style.overflow = 'auto'; // Restore background scrolling
                
                // Clear the iframe source after animation finishes so audio stops playing
                setTimeout(() => {
                    gameIframe.src = "";
                }, 700);
            });

            // Building the game grid
            const freeContainer = document.getElementById('free-games');
            const paidContainer = document.getElementById('paid-games');

            function createGameContent(game) {
                const img = document.createElement('img');
                img.src = game.image;
                img.alt = game.name;
                img.className = 'game-img';
                
                const title = document.createElement('div');
                title.innerText = game.name;
                
                return { img, title };
            }

            // Loop through all Free Games
            gameData.free.forEach(game => {
                const box = document.createElement('div');
                box.className = 'game-box';
                
                const { img, title } = createGameContent(game);
                
                box.appendChild(img);
                box.appendChild(title);
                
                // Click logic for Free Games (Opens in overlay)
                box.addEventListener('click', () => {
                    launchGame(game.url);
                });
                
                freeContainer.appendChild(box);
            });

            // Loop through all Paid Games
            gameData.paid.forEach(game => {
                const box = document.createElement('div');
                box.className = 'game-box';
                
                const { img, title } = createGameContent(game);
                
                box.appendChild(img);
                box.appendChild(title);
                
                // Click logic for Paid Games (Checks code, then opens in overlay)
                box.addEventListener('click', () => {
                    const userCode = prompt(`Enter the special code to play ${game.name}:`);
                    
                    if (userCode === "ilovesophia") {
                        launchGame(game.url);
                    } else if (userCode !== null) {
                        alert("Access Denied. Incorrect code.");
                    }
                });
                
                paidContainer.appendChild(box);
            });
        });
    </script>
